# Demo overlay. 256x5 rand_r + skip-offscreen mob obs (headskip256, perf 0.389).
# 0413 LCG control on the same recipe is 0.401. JAX wrap-obs retrains to 0.274.
# 3*H*H*L = 983040

[env]
# Web: skip the 1024-map reset pool (WASM memory / startup).
reset_pool_size = 0
action_mask = 1

[policy]
hidden_size = 256
num_layers = 5
