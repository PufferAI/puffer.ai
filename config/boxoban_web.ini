# Demo overlay. Train recipe: config/web1m/boxoban.ini (copied to the train box).
# Source sweep: boxoban/sweep_1787560351658_1492.ini  -> integer policy 256x4 (C truncates fractional layers).
# 3*H*H*L = 786432

[env]
# Match training: DeepMind Boxoban medium (difficulty 2).
difficulty = 2
map_bin = resources/boxoban/web_maps.bin

[policy]
hidden_size = 256
num_layers = 4
